name: 功能建议
description: 新的路由能力、控制台改进或兼容性需求
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 `README.md` 的项目定位与「安全」段、`CHANGELOG.md`:有些能力不在当前范围内
        (远程鉴权、多用户、自动更新、Docker 镜像)。如果正是这类,请说明你的场景为什么非它不可。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述场景与现在的做法,而不是先给方案。能用现有配置/命令绕过的话,也写上。
      placeholder: |
        我在 ... 的时候需要 ...;现在只能 ...,因为 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 期望的入口(控制台字段 / 环境变量 / `mixctl` 子命令 / API)与大致行为。有取舍也写上。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 试过什么、为什么不够用。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 代理协议转换
        - 路由规则 / 会话分发
        - 槽位路由
        - 控制台
        - 配置格式
        - CLI(`mixctl`)
        - 安装 / 发布
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这里没有真实 API Key、会话内容或完整运行数据文件
          required: true
        - label: 这不是安全漏洞报告(安全问题走 `SECURITY.md` 的私密通道)
          required: true
